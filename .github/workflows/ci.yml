name: CI (retroalimentación)

on:
  # Un cambio que solo toca documentación (ADR, DEPLOYMENT.md, README) no gasta minutos de CI.
  push:
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo cancela la corrida anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1" # la misma versión que el Dockerfile
          python-version: "3.13"

      - name: Instalar dependencias exactas (uv.lock)
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -v

      - name: Resumen
        if: always()
        run: |
          {
            echo "### Resultado de la CI"
            echo ""
            echo "Este resultado es retroalimentación sobre tu trabajo. Los tests públicos del reto"
            echo "son una muestra: el contrato completo de la guía del reto tiene más casos borde y otros datos."
            echo "Revisa también tu despliegue y no modifiques los tests oficiales ni los workflows."
          } >> "$GITHUB_STEP_SUMMARY"
